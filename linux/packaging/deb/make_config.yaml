display_name: Fluxora
package_name: Fluxora
maintainer:
  name: Fluxora Contributors
  email: support@fluxora.io

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-dev
  - libkeybinder-3.0-dev

keywords:
  - Fluxora
  - Fluxora
  - Clash
  - ClashMeta
  - Mihomo
  - Proxy

generic_name: Fluxora

categories:
  - Network

startup_notify: true
startup_wm_class: io.fluxora.app

postinstall_scripts:
  - |
    for CORE_PATH in "/usr/share/Fluxora/FluxoraCore" "/usr/share/Fluxora/FluxoraCore" "/usr/share/fluxora/FluxoraCore"; do
      if [ -f "$CORE_PATH" ]; then
        chown root:root "$CORE_PATH" 2>/dev/null || true
        chmod +sx "$CORE_PATH" 2>/dev/null || true
      fi
    done
postuninstall_scripts:
  - |
    for CORE_PATH in "/usr/share/Fluxora/FluxoraCore" "/usr/share/Fluxora/FluxoraCore" "/usr/share/fluxora/FluxoraCore"; do
      if [ -f "$CORE_PATH" ]; then
        chmod -s "$CORE_PATH" 2>/dev/null || true
      fi
    done