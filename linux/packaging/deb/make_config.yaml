display_name: bettbox+
package_name: Bettbox
maintainer:
  name: appshub
  email: appshubcc@gmail.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-dev
  - libkeybinder-3.0-dev

keywords:
  - bettbox+
  - Bettbox
  - Clash
  - ClashMeta
  - Mihomo
  - Proxy

generic_name: bettbox+

categories:
  - Network

startup_notify: true
startup_wm_class: com.appshub.bettboxplus

postinstall_scripts:
  - |
    for CORE_PATH in "/usr/share/bettbox+/BettboxCore" "/usr/share/Bettbox/BettboxCore" "/usr/share/bettboxplus/BettboxCore"; do
      if [ -f "$CORE_PATH" ]; then
        chown root:root "$CORE_PATH" 2>/dev/null || true
        chmod +sx "$CORE_PATH" 2>/dev/null || true
      fi
    done
postuninstall_scripts:
  - |
    for CORE_PATH in "/usr/share/bettbox+/BettboxCore" "/usr/share/Bettbox/BettboxCore" "/usr/share/bettboxplus/BettboxCore"; do
      if [ -f "$CORE_PATH" ]; then
        chmod -s "$CORE_PATH" 2>/dev/null || true
      fi
    done