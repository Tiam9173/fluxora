# CI — automated test & static analysis.
#
# Purpose: run `flutter analyze` and `flutter test` on pull requests and on
# pushes to the main integration branches. The release pipeline lives in
# `build.yaml` and is triggered only by `v*` tags; this workflow deliberately
# excludes tags so the two never run the same event.
#
# Scope: static checks only — no signing, no packaging, no artifacts, no release.
name: test

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Read-only: the checks only need the checked-out source. Nothing here writes
# back to the repository, so no broader permission is granted.
permissions:
  contents: read

# A newer run on the same ref supersedes an in-flight one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches build.yaml so both workflows use the same Node runtime for actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # R7-8.2 — that experimental flag makes several test files share one OS
      # process (and therefore one PID). The root tearDownAll in
      # test/flutter_test_config.dart deletes %TEMP%\fluxora_test_data_<pid>,
      # so a shared PID would let the first file delete a sandbox another file
      # is still writing to. See PHASE_06_8_R7_8_2_U1_TEST_PROCESS_MODEL_AUDIT.
      #
      # The token is assembled at runtime on purpose: if this file contained the
      # literal string, `git grep` below would match this very step and the
      # guard would fail on every run.
      - name: Guard — reject the experimental faster-testing flag
        shell: bash
        run: |
          flag="experimental-faster""-testing"
          if hits=$(git grep -nI -e "--$flag" -- \
                       '.github' '*.yaml' '*.yml' '*.sh' '*.ps1' '*.bat' 'Makefile' \
                       ':(exclude)*.md'); then
            printf '%s\n' "$hits"
            echo "::error::--$flag is forbidden: it makes test files share one OS process and PID."
            exit 1
          else
            # git grep exits 1 for "no match" and >1 for a real failure. Only 1
            # means clean; anything else must not be mistaken for a pass.
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::git grep failed with exit code $rc"
              exit "$rc"
            fi
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the release workflow builds with (build.yaml).
          flutter-version: '3.47.4'
          cache: true
          cache-key: flutter-test-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  connection:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - name: Core connection lifecycle
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -mod=readonly -tags=with_gvisor ./...
      - name: Controller and desktop navigation regressions
        run: >-
          flutter test
          test/controller/change_mode_and_debounce_test.dart
          test/controller/change_proxies_batch_test.dart
          test/controller/core_watchdog_test.dart
          test/controller/profile_switch_sync_test.dart
          test/services/android_vpn_sync_test.dart
          test/views/dashboard/start_button_state_test.dart
          test/views/proxies/chain_hop_picker_test.dart
          test/views/proxies/proxies_group_sort_cache_test.dart
          test/theme/hybrid_glass_test.dart
          test/theme/liquid_glass_test.dart
          test/views/page_transition_test.dart
          test/views/sidebar_navigation_test.dart
          test/widgets/kept_page_view_test.dart
          test/widgets/route_motion_test.dart
      - name: Connection UI on wide and narrow screens
        run: flutter test test/views/ui_refinement_test.dart --name 'connection node|rejected picker|motion state and navigation frames|actual home and settings|network result motion'
