name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_validation:
        description: 'Run Release Build validation only (no GitHub Release)'
        required: true
        default: true
        type: boolean
      target_platform:
        description: 'Target platform to build'
        required: false
        default: 'android'
        type: choice
        options:
          - android
          - all
          - windows
          - macos
          - linux

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (!contains(github.ref, '-') || contains(github.ref_name, 'pre')) }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
  
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          TARGET_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.target_platform || 'all' }}
        run: |
          python3 -c "
          import json, os
          target = os.environ.get('TARGET_PLATFORM', 'all')
          all_matrix = [
            {'platform': 'android', 'os': 'ubuntu-24.04', 'arch': 'arm64'},
            {'platform': 'android', 'os': 'ubuntu-24.04', 'arch': 'amd64'},
            {'platform': 'android', 'os': 'ubuntu-24.04', 'arch': 'arm'},
            {'platform': 'android', 'os': 'ubuntu-24.04', 'arch': 'universal'},
            {'platform': 'windows', 'os': 'windows-2022', 'arch': 'amd64'},
            {'platform': 'windows', 'os': 'windows-11-arm', 'arch': 'arm64'},
            {'platform': 'windows', 'os': 'windows-2022', 'arch': 'amd64', 'compatible': True},
            {'platform': 'macos', 'os': 'macos-15', 'arch': 'arm64'},
            {'platform': 'macos', 'os': 'macos-15', 'arch': 'amd64'},
            {'platform': 'macos', 'os': 'macos-15', 'arch': 'amd64', 'compatible': True},
            {'platform': 'linux', 'os': 'ubuntu-22.04', 'arch': 'amd64'},
            {'platform': 'linux', 'os': 'ubuntu-24.04-arm', 'arch': 'arm64'},
            {'platform': 'linux', 'os': 'ubuntu-22.04', 'arch': 'amd64', 'compatible': True}
          ]
          if target and target != 'all':
            filtered = [m for m in all_matrix if m['platform'] == target]
          else:
            filtered = all_matrix
          matrix_json = json.dumps({'include': filtered})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'matrix={matrix_json}\n')
          "

  build:
    needs: [ setup ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Keystore (Android)
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
            echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
          else
            echo "Error: KEYSTORE secret is not configured. Aborting Android release build to prevent debug signature fallback."
            exit 1
          fi
          
      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::ForceIPv4=true --fix-missing libcurl4-openssl-dev ninja-build libgtk-3-dev rpm

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.compatible == true && '1.20.x' || '1.25.x' }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.47.4' }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true


      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Disable Swift Package Manager (macOS)
        if: matrix.platform == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"
      - name: Build Fluxora (Non-Windows)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          fi
          export APP_BUILD_NAME="$version"
          export APP_VERSION="$version"
          flutter pub get
          dart run build_runner build -d
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Install SignPath (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            Write-Host "SIGNPATH_API_TOKEN is not configured. Skipping module installation."
            exit 0
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force -Scope CurrentUser -Repository PSGallery

      - name: Set Signing Policy Slug (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $isStable = '${{ env.IS_STABLE }}' -eq 'true'
          $isPre = '${{ env.IS_PRERELEASE }}' -eq 'true'

          if ($isStable) {
            $exePolicy = "release-signing"
            $installerPolicy = "release-signing"
          } elseif ($isPre) {
            $exePolicy = "test-signing"
            $installerPolicy = "release-signing"
          } else {
            $exePolicy = "test-signing"
            $installerPolicy = "test-signing"
          }
          Write-Host "Setting EXE_SIGNING_POLICY_SLUG to $exePolicy"
          Write-Host "Setting INSTALLER_SIGNING_POLICY_SLUG to $installerPolicy"
          "EXE_SIGNING_POLICY_SLUG=$exePolicy" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SIGNING_POLICY_SLUG=$installerPolicy" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned Core
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-core
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/FluxoraCore.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Core (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Fluxora'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-core.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $signedCoreHash = (Get-FileHash libclash/windows/FluxoraCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Signed Core SHA256 (TOKEN for Helper): $signedCoreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $signedCoreHash ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned HelperService
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-helper
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/FluxoraHelperService.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign HelperService (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Fluxora'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-helper.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build Fluxora (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/FluxoraCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $version = if ('${{ github.ref_name }}' -match '^v\d') { 
            '${{ github.ref_name }}' -replace '^v', '' 
          } else { 
            (Get-Content pubspec.yaml | Select-String '^version:\s*([^\+]+)').Matches.Groups[1].Value.Trim() 
          }
          
          $flutterArgs = @(
            "build", "windows", "--release", "--verbose",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_VERSION=$version",
            "--dart-define=APP_ASSET_SUFFIX=windows-$desc-setup.exe"
          )
          if ($env:SENTRY_DSN) {
            $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          if ($env:IPINFO_TOKEN) {
            $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN"
          }
          
          flutter @flutterArgs

      - name: Upload Unsigned Fluxora
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-fluxora
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-fluxora-${{ matrix.arch }}-${{ matrix.compatible }}
          path: build/windows/${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}/runner/Release/Fluxora.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Fluxora (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Fluxora'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-fluxora.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'build/windows/${{ matrix.arch == ''arm64'' && ''arm64'' || ''x64'' }}/runner/Release'

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          fi
          export APP_BUILD_NAME="$version"
          export APP_VERSION="$version"
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} ${{ matrix.compatible == true && '--compatible' || '' }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Find Installer Path
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $installer = (Resolve-Path "dist/Fluxora-*-windows-$desc-setup.exe").Path
          echo "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INSTALLER_FILENAME=$(Split-Path -Leaf $installer)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unsigned Installer
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign Installer (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'Fluxora'
          signing-policy-slug: '${{ env.INSTALLER_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist'
      
      - name: Clean up intermediate unsigned artifacts
        if: always() && matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-fluxora-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          failOnError: false
      
      - name: Verify Core Permissions (Linux)
        if: matrix.platform == 'linux' && matrix.compatible != true
        shell: bash
        run: |
          echo "=== Verifying FluxoraCore setuid in DEB package ==="
          if ls dist/*fluxora*.deb 1>/dev/null 2>&1; then
            DEB_PERMS=$(dpkg-deb -c dist/*fluxora*.deb | grep FluxoraCore || true)
            echo "$DEB_PERMS"
            if echo "$DEB_PERMS" | grep -q 'rws'; then
              echo "OK: FluxoraCore in DEB has setuid bit"
            else
              echo "WARNING: FluxoraCore in DEB is missing setuid bit (will be set by postinst on install)"
              POSTINST=$(dpkg-deb -e dist/*fluxora*.deb /tmp/fluxora-deb-control && cat /tmp/fluxora-deb-control/postinst || true)
              if ! echo "$POSTINST" | grep -q '/FluxoraCore'; then
                echo "ERROR: postinst script does not set permissions on FluxoraCore"
                exit 1
              fi
            fi
          fi
          echo "=== Verifying FluxoraCore setuid in RPM package ==="
          if ls dist/*fluxora*.rpm 1>/dev/null 2>&1; then
            RPM_PERMS=$(rpm -qplv dist/*fluxora*.rpm | grep FluxoraCore || true)
            echo "$RPM_PERMS"
            if ! echo "$RPM_PERMS" | grep -q 'rws'; then
              echo "ERROR: FluxoraCore in RPM is missing setuid bit"
              exit 1
            fi
          fi

      - name: Verify Android APK Signature
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "=== Verifying APK Signature ==="
          APK_FILE=$(find dist/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in dist/ directory!"
            exit 1
          fi
          echo "Checking $APK_FILE"
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found!"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" || { echo "Signature verification failed!"; exit 1; }
          if "$APKSIGNER" verify --print-certs "$APK_FILE" | grep -q "CN=Android Debug"; then
            echo "Error: APK is signed with Android Debug certificate! Release builds must use release keystore."
            exit 1
          fi
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_FILE" | grep -i "SHA-256 digest" | awk '{print $NF}' | head -n 1)
          echo "Release Certificate SHA-256 Verified: $CERT_SHA256"
          
          AAPT=$(find $ANDROID_SDK_ROOT/build-tools -name aapt | sort -r | head -n 1)
          if [ -n "$AAPT" ]; then
            echo "=== Verifying APK Metadata ==="
            "$AAPT" dump badging "$APK_FILE" | grep -E "package: name="
          fi
          echo "Signature verified successfully."

      - name: Upload Artifacts (Non-Linux)
        if: matrix.platform != 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: Fluxora-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}
          path: ./dist/*
          overwrite: true

      - name: Upload DEB Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: Fluxora-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-deb
          path: ./dist/*.deb
          archive: false
          overwrite: true

      - name: Upload AppImage Artifact
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: Fluxora-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-AppImage
          path: ./dist/*.AppImage
          archive: false
          overwrite: true

      - name: Upload RPM Artifact
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: Fluxora-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-rpm
          path: ./dist/*.rpm
          archive: false
          overwrite: true

  upload:
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Fluxora-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          printf '%s\n' "- Fixes and improvements" "- Recommended version update" > release.md

      - name: Patch release.md
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          fi
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      - name: Release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
